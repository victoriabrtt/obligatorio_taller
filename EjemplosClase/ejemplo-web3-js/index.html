<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SimpleStorage DApp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.6.0/ethers.min.js" type="module"></script>
</head>

<body>
    <h1>SimpleStorage en Vanilla JS</h1>

    <div id="wallet">
        <button id="btnConnect">Conectar wallet</button>
        <span id="addrDisplay"></span>
    </div>

    <div id="getValueRow" style="margin-top:16px;">
        <button id="btnGet">Obtener valor</button>
        <span id="getValueDisplay"></span>
    </div>

    <div id="setValueRow" style="margin-top:16px;">
        <input type="number" id="inpSet" placeholder="Nuevo valor" />
        <button id="btnSet">Establecer valor</button>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
